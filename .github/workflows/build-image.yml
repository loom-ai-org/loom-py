name: Build images

# The manylinux images the accelerator wheels build in, pushed to ghcr.io. Separate from wheels.yml
# and NOT triggered by it, deliberately: these change when an SDK pin changes, which is rare, and
# rebuilding them per release would put the cost back into every release. wheels.yml consumes
# whatever `:cuda` and `:vulkan` currently point at.
#
# Run this by hand after touching .github/docker/Dockerfile, or after bumping the shaderc/
# Vulkan-Headers pins in the engine's cmake/VulkanToolchain.cmake -- those two have to agree, and
# nothing enforces it: a stale image does not fail, it silently rebuilds shaderc inside every job.

on:
  push:
    paths:
      - ".github/docker/Dockerfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write        # pushing to ghcr.io under this org
    strategy:
      fail-fast: false
      matrix:
        target: [cuda, vulkan]
        arch: [x86_64, aarch64]
        # NATIVE per architecture, never QEMU. The CUDA target only installs RPMs and would survive
        # emulation; the Vulkan target compiles shaderc from source, which under emulation is a
        # different order of magnitude rather than merely slower.
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    manylinux: quay.io/pypa/manylinux_2_28_x86_64:latest,  cuda_repo: x86_64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, manylinux: quay.io/pypa/manylinux_2_28_aarch64:latest, cuda_repo: sbsa }
    steps:
      - uses: actions/checkout@v4

      # The runner's own disk is the binding constraint on the CUDA image -- a hosted ubuntu runner
      # has roughly 14 GB free, and the preinstalled toolchains are the largest thing on it that this
      # job will never use.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          target: ${{ matrix.target }}
          push: true
          build-args: |
            MANYLINUX=${{ matrix.manylinux }}
            CUDA_REPO_ARCH=${{ matrix.cuda_repo }}
          # ARCH-SUFFIXED TAGS rather than one multi-arch manifest. A manifest would be tidier for a
          # `docker pull`, but it needs both arches merged in a third job, and cibuildwheel names its
          # image per architecture anyway (CIBW_MANYLINUX_X86_64_IMAGE / _AARCH64_IMAGE) -- so the
          # explicit tag is what the consumer actually wants, and one fewer moving part.
          tags: ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.target }}-${{ matrix.arch }}
          # A registry cache rather than the default inline one, so the shaderc build is reused across
          # runs even when the layer above it changed.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.target }}-${{ matrix.arch }}-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.target }}-${{ matrix.arch }}-cache,mode=max
