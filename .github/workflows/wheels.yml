name: Wheels

# Builds manylinux_2_28 x86_64 wheels (+ sdist) via cibuildwheel -- see pyproject.toml's
# [tool.cibuildwheel] for the actual build matrix/image/test-command. Separate from ci.yml
# deliberately: ci.yml's `pip install ".[test,hub]"` builds once, against whatever glibc the runner
# has, to test fast on every push; this workflow's job is the artifact that gets uploaded to PyPI,
# which is a slower, containerized, once-per-release thing.
#
# Publishing goes through PyPI trusted publishing, configured for all three projects (loom-py-rt and
# the two backends) -- there is no API token in this repo and none should be added. All three shipped
# 1.0.0rc3 through this path, which is what proves it rather than an assumption.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels/sdist to PyPI"
        type: boolean
        default: false
      gpu_smoke_test:
        description: "Also run the GPU smoke test (needs a self-hosted runner online)"
        type: boolean
        default: false
      only:
        # A FULL DISPATCH IS FOUR BASE-WHEEL JOBS, FOUR BACKEND JOBS, AN SDIST AND A QEMU CHECK, and
        # the CUDA rows alone compile hundreds of kernels. That is the right shape for a release and
        # the wrong one for "I need the Metal wheel to create its PyPI project", which is a 0.18 MB
        # artifact behind an hour of unrelated compilation.
        #
        # Release runs ignore this entirely -- the guards below are written so that a `release` event
        # always builds everything, and this input only narrows a MANUAL run.
        description: "Which artifacts to build (manual runs only; a release always builds all)"
        type: choice
        default: all
        options: [all, base, backends, metal, sdist]

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'base' }}
    # NATIVE ARM RUNNERS, not QEMU. cibuildwheel can emulate aarch64 and it is the wrong tool here:
    # the base wheel compiles the whole engine, and the accelerator wheels below compile hundreds of
    # CUDA kernels, which under emulation is an overnight job rather than a slow one.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,     arch: x86_64,  artifact: x86_64 }
          - { runner: ubuntu-24.04-arm,  arch: aarch64, artifact: aarch64 }
          # THE TWO APPLE ROWS (P4.10). `arch` is cibuildwheel's spelling, which on macOS is Apple's:
          # `arm64` is the same ISA Linux calls `aarch64`, and the wheels tag as `macosx_11_0_arm64`
          # and `macosx_10_13_x86_64`. Two native builds rather than one `universal2`, because a fat
          # binary doubles the download for everyone to serve one half -- and that half is ending.
          #
          # THE RUNNER LABELS ARE NOT THE ONES THIS ITEM WAS SCOPED WITH. `macos-13`/`macos-14` were
          # the Intel/arm pair when P4.10 was written; `macos-13` has since been retired and
          # `macos-14` is deprecated. `macos-15` is the GA Apple Silicon image and `macos-15-intel`
          # its Intel counterpart -- the label to check when this job one day fails to schedule.
          #
          # `artifact` exists because `arch` stopped being unique: Linux x86_64 and Apple Intel are
          # both `x86_64`, and two upload-artifact steps sharing a name is an error, not a merge.
          - { runner: macos-15,          arch: arm64,   artifact: macos-arm64 }
          - { runner: macos-15-intel,    arch: x86_64,  artifact: macos-x86_64 }
    steps:
      # `submodules: recursive` is load-bearing here too -- same reason as ci.yml: the engine is a
      # submodule, and cibuildwheel copies this checkout as-is into its build containers.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A FULL VERSION, because `pypa/cibuildwheel@v2` does not resolve -- that repository publishes no
      # bare major tags at all, so the ref this workflow shipped with had never been valid. It went
      # unnoticed because this workflow had never run: its first execution, after the P4.8 merge,
      # failed both base-wheel jobs at "Unable to resolve action". The backend jobs below were
      # unaffected because they invoke `pipx run cibuildwheel` instead, which is also the evidence
      # that this project's [tool.cibuildwheel] config is v4-compatible.
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-base-${{ matrix.artifact }}
          path: wheelhouse/*.whl

  # The accelerator packages. One wheel per platform and NOT per interpreter: the payload is a plain
  # shared library that ggml dlopens and Python never imports, so these are tagged `py3-none-*` and
  # `build = "cp310-*"` in each pyproject names only the interpreter that runs the build.
  #
  # `packaging/stage.py` is required rather than convenient. cibuildwheel mounts ONLY the package
  # directory into its container, and a backend package deliberately reaches outside itself for the
  # shared BackendPackage.cmake and for the engine submodule's GgmlPin.cmake -- which is what stops a
  # backend wheel being built against a ggml its base wheel never saw. Staging assembles a complete
  # tree from the submodule instead of duplicating the pin (BACKLOG.md P4.8i).
  build-backends:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'backends' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read     # pulling the manylinux-loom image built by build-image.yml
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan]
        # `arch` is a MATRIX KEY, not an include-only one, and the difference is not cosmetic. With
        # only `backend` in the matrix and two include objects carrying `arch`/`runner`, GitHub applies
        # the first to every combination and then finds the second one conflicts -- producing jobs with
        # no `backend` set rather than the four intended. Listing both axes and using `include` purely
        # to map an arch onto its runner is the spelling that means what it looks like.
        arch: [x86_64, aarch64]
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A CUDA image is several gigabytes against a hosted runner's ~14 GB of free disk.
      - name: Reclaim disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; df -h /

      # A PUBLIC REPOSITORY DOES NOT MEAN A PUBLIC PACKAGE. ghcr images default to private even when
      # the repo that built them is public, so an anonymous `docker pull` of the image below returns
      # `unauthorized` -- verified by trying it. cibuildwheel pulls its container itself and does not
      # authenticate, so without this step the job fails on its own image.
      #
      # Logging in here rather than making the package public keeps the workflow working under either
      # visibility, and `packages: read` is the whole of the permission it needs.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the package
        run: python packaging/stage.py ${{ matrix.backend }} staged

      # The image carries the SDK, so there is no before-all here -- see .github/docker/Dockerfile.
      # Run FROM the staged directory: cibuildwheel requires the package to be inside the working
      # directory, which is also why staging writes into the workspace rather than to a temp path.
      - name: Build
        working-directory: staged
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Arch-suffixed, matching build-image.yml's tags. cibuildwheel reads whichever of these two
          # matches the arch it is building, so setting both is correct rather than redundant.
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.backend }}-x86_64
          CIBW_MANYLINUX_AARCH64_IMAGE: ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.backend }}-aarch64
        run: pipx run cibuildwheel --output-dir ../wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.backend }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # METAL, WHICH IS A SEPARATE JOB RATHER THAN A ROW OF THE MATRIX ABOVE (P4.11). Everything that
  # makes `build-backends` what it is, is Linux: a manylinux container carrying an SDK, a
  # `docker/login-action` step to pull it, and an `arch` axis with two values. Metal has none of
  # those -- it builds on a macOS runner with no container at all, and for exactly one architecture.
  # Folding it in would mean an `if:` on every step of that job.
  #
  # NO `before-all` AND NO SDK STEP, which is the part worth stating because it looks like an
  # omission. `GGML_METAL_EMBED_LIBRARY` defaults on with Metal and embeds the `.metal` SOURCE via
  # `.incbin`, compiled by the Metal framework at run time -- so the build never invokes
  # `xcrun metal`, and the full-Xcode install that utility would need is not a requirement here. The
  # runner's Command Line Tools are enough.
  build-metal:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'metal' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same reason as the Linux backends: cibuildwheel mounts only the package directory, and this
      # package deliberately reaches outside itself for the shared BackendPackage.cmake and for the
      # engine submodule's GgmlPin.cmake, which is what stops a backend wheel being built against a
      # ggml its base wheel never saw.
      - name: Stage the package
        run: python packaging/stage.py metal staged

      # The pinned ACTION rather than `pipx run cibuildwheel`, which is what the Linux backend jobs
      # above use. Two reasons: `pipx` is preinstalled on the Ubuntu images and is not something to
      # rely on being there on a macOS one, and the action takes `package-dir` directly, so the
      # staged tree does not need a `working-directory` and a `../` output path. Same version as
      # `build-wheels` uses, so both macOS paths run one cibuildwheel.
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: staged
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: arm64

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-metal-arm64
          path: wheelhouse/*.whl

  # THE RUNG NO RUNNER OCCUPIES. The aarch64 wheel ships eight `libggml-cpu-armv*.so` and ggml picks
  # between them at run time by scoring each against `getauxval(AT_HWCAP)` -- so which one a machine
  # loads is decided by that machine's CPU, and CI only ever exercises the CPU it runs on.
  # `ubuntu-24.04-arm` is Neoverse: dotprod, FP16, i8mm. It therefore never selects `armv8.0_1`, which
  # is the ONLY variant a Raspberry Pi 4 can load -- its Cortex-A72 is ARMv8.0-A with none of those
  # features, so the other seven score 0 there. Without this job the Pi 4 claim in README.md rests on
  # reading the score function rather than on running it.
  #
  # QEMU is the right tool HERE and the wrong one for building (see build-wheels): emulating an import
  # takes seconds, and `QEMU_CPU` is the only way to obtain a CPU without dotprod at all -- no hosted
  # runner, on any provider, is that old.
  #
  # The images are Debian, which is what Raspberry Pi OS is: bookworm carries glibc 2.36 and bullseye
  # 2.31, so the bullseye row also puts a floor under the `manylinux_2_28` tag rather than trusting it.
  #
  # A GATE, unlike the GPU smoke test below. That one cannot gate a release because a self-hosted
  # runner may be offline and the job would queue for 24 hours; this one runs on a hosted runner with
  # nothing but docker, so there is no reason to let a release past it.
  raspberry-pi-check:
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A72 has no dotprod, no FP16 arithmetic, no SVE -- exactly one variant is loadable, so this
          # row is an equality check.
          - board: "Pi 4 / 400 / CM4, Bookworm"
            image: "arm64v8/python:3.12-slim-bookworm"
            cpu: cortex-a72
            expect: "libggml-cpu-armv8.0_1.so"
          - board: "Pi 4 / 400 / CM4, Bullseye (glibc 2.31)"
            image: "arm64v8/python:3.11-slim-bullseye"
            cpu: cortex-a72
            expect: "libggml-cpu-armv8.0_1.so"
          # A76 has dotprod and FP16 but no SVE. Two variants are legitimate winners depending on
          # whether QEMU's model advertises FPHP, and both are safe to execute -- so this row asserts
          # the ladder CLIMBS off the baseline, without pinning a detail of QEMU's CPU modelling that
          # would fail a release for no defect of ours.
          - board: "Pi 5 / CM5, Bookworm"
            image: "arm64v8/python:3.12-slim-bookworm"
            cpu: cortex-a76
            expect: "libggml-cpu-armv8.2_1.so,libggml-cpu-armv8.2_2.so"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-base-aarch64
          path: dist

      - uses: docker/setup-qemu-action@v3

      # Written here rather than taken from the checkout because this job needs no checkout at all --
      # it tests the built artifact, and pulling the source tree in would invite the very sys.path
      # shadowing the wheel test step goes out of its way to avoid.
      - name: Write the check
        run: |
          cat > check.py <<'PY'
          import os, pathlib, re
          import loom

          allowed = os.environ["EXPECT"].split(",")
          devices = loom.devices()   # populates the registry, which is what runs the selection

          # ggml dlopens every candidate to score it and dlcloses the losers (RTLD_NOW | RTLD_LOCAL,
          # no RTLD_NODELETE), so the winner is the only one still mapped.
          maps = pathlib.Path("/proc/self/maps").read_text()
          mapped = sorted(set(re.findall(r"libggml-cpu-[\w.]+\.so", maps)))
          print(f"cpu={os.environ['QEMU_CPU']} devices={[d['name'] for d in devices]} mapped={mapped}")

          assert any(d["is_cpu"] for d in devices), (
              f"no CPU device on {os.environ['QEMU_CPU']} -- with GGML_BACKEND_DL that means no "
              f"variant scored above 0, which is a wheel that cannot run on this board AT ALL"
          )
          assert len(mapped) == 1, f"expected one variant to survive selection, got {mapped}"
          assert mapped[0] in allowed, (
              f"{mapped[0]} was selected on {os.environ['QEMU_CPU']}; expected one of {allowed}"
          )
          PY

      - name: Install and select on ${{ matrix.board }}
        run: |
          docker run --rm --platform linux/arm64 \
            -e QEMU_CPU=${{ matrix.cpu }} \
            -e EXPECT='${{ matrix.expect }}' \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/check.py:/check.py:ro" \
            ${{ matrix.image }} \
            bash -euo pipefail -c '
              pip install --quiet --no-index --find-links /dist loom-py-rt
              cd /tmp   # a neutral cwd, so the installed package is what gets imported
              python /check.py
            '

  # THE ONE CHECK A HOSTED RUNNER CANNOT DO. Building CUDA needs no GPU, so everything above runs on
  # hosted runners; running a model needs one. This job is why the workstation is registered as a
  # self-hosted runner, and it is not ceremony -- a soname mismatch between the base wheel and a
  # backend loads without error, registers nothing, and shows up only as an accelerator missing from
  # `loom.devices()` (BACKLOG.md P4.8g). Nothing in the build catches that.
  # OPT-IN, AND NOT A RELEASE GATE -- deliberately, because the alternative is worse than no check.
  # A job targeting self-hosted labels with no matching runner online does not fail fast: it sits
  # queued for up to 24 hours and then times out, so putting this in `publish-pypi`'s `needs:` would
  # mean every release silently depends on one machine being switched on, and hangs rather than fails
  # when it is not.
  #
  # When a runner is registered and you want releases actually gated on a model running: add
  # `gpu-smoke-test` back to publish-pypi's `needs:` and drop the `if:` below. That is a deliberate
  # trade -- it buys the one check a hosted runner cannot do, at the cost of tying releases to a
  # machine's uptime.
  gpu-smoke-test:
    needs: [build-wheels, build-backends]
    if: ${{ inputs.gpu_smoke_test }}
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*-x86_64
          path: dist
          merge-multiple: true

      - name: Install into a clean venv and run a model
        env:
          # A real exported GGUF on the runner. The gate suite's own fixture rule, not a path baked in
          # here -- see the engine's tests/support/fixtures.h.
          LOOM_FIXTURES: ${{ env.LOOM_FIXTURES }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/loom-smoke
          # `*manylinux*` rather than `*`: the glob above is `wheels-*-x86_64`, and since P4.10 that
          # also matches `wheels-base-macos-x86_64`. This runner is Linux, so an Apple Intel wheel in
          # the same directory is not a candidate -- and `pip install dist/*.whl` would fail on it
          # rather than skip it, because an explicit filename is a request, not a preference.
          /tmp/loom-smoke/bin/pip install --quiet dist/*manylinux*.whl
          cd /tmp   # a neutral cwd, so the venv's package is what gets imported
          /tmp/loom-smoke/bin/python - <<'EOF'
          import loom
          names = [d["name"] for d in loom.devices()]
          print("devices:", names)
          assert any(n != "CPU" for n in names), (
              "no accelerator registered -- a backend that fails to load does so SILENTLY, "
              "so this assertion is the only thing standing between that and a green release"
          )
          EOF

  build-sdist:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'sdist' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `sdist.include` in pyproject.toml's [tool.scikit-build] is what makes vendor/loom.cpp/** land
      # in the tarball -- without it, `pip install` from the sdist alone fails the same way a bare
      # checkout without `--recursive` does.
      - run: pip install build && python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # PUBLISHES ON RELEASE, one project at a time. This is three uploads rather than one because the
  # artifacts belong to THREE PyPI projects -- loom-py-rt, -cuda and -vulkan -- and trusted publishing
  # mints its token by exchanging an OIDC claim per project. One upload of a mixed directory may work,
  # depending on how the exchange scopes the token across projects that share a publisher; three
  # unambiguously do, and a failure names which project it was rather than leaving you to guess.
  #
  # Each project has a TRUSTED PUBLISHER on PyPI (owner `loom-ai-org`, repo `loom-py`, workflow
  # `wheels.yml`, environment `pypi`), which is what mints the token -- there is none stored here and
  # none should be added. A fourth project would need its own publisher added before its first upload;
  # everything above this job runs regardless, and its artifacts are downloadable from the run.
  #
  # `skip-existing` because PyPI filenames are IMMUTABLE and re-running a partly-failed release is the
  # normal recovery: without it the second attempt dies on the files the first one already uploaded.
  # It does not paper over a real problem -- a file that differs from what is published cannot be
  # uploaded under either setting.
  #
  # ORDER: the backends last. A base wheel with no backend published leaves `[cuda]` unresolvable,
  # which is a visible install error; a backend with no base is the same error from the other side.
  # Neither is silent, so this is about which half is fixed sooner rather than about safety.
  publish-pypi:
    needs: [build-wheels, build-backends, build-metal, build-sdist, raspberry-pi-check]
    # `inputs.only == 'all'` as well as `inputs.publish`: a narrowed dispatch has skipped jobs, and
    # `needs` would skip this one anyway -- but silently. Saying it here means a run that asked to
    # publish a partial set is refused for a reason somebody can read, rather than just not happening.
    if: ${{ github.event_name == 'release' || (inputs.publish && inputs.only == 'all') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC) -- no token stored in this repo
    steps:
      # Each project's files into their own directory. The artifact NAMES already carry the split --
      # `wheels-base-*`, `wheels-cuda-*`, `wheels-vulkan-*` -- which is why they are named that way.
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-base-*"
          path: dist-base
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist-base
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-cuda-*"
          path: dist-cuda
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-vulkan-*"
          path: dist-vulkan
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-metal-*"
          path: dist-metal
          merge-multiple: true

      - name: Publish loom-py-rt
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-base
          skip-existing: true

      - name: Publish loom-py-rt-cuda
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cuda
          skip-existing: true

      - name: Publish loom-py-rt-vulkan
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-vulkan
          skip-existing: true

      # A FOURTH PYPI PROJECT NEEDS ITS OWN TRUSTED PUBLISHER before this step can succeed -- owner
      # `loom-ai-org`, repo `loom-py`, workflow `wheels.yml`, environment `pypi`, project
      # `loom-py-rt-metal` -- configured on PyPI, not here. Until it exists this step fails while
      # everything above it still uploads, and the wheel is downloadable from the run.
      - name: Publish loom-py-rt-metal
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-metal
          skip-existing: true
