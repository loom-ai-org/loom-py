name: Wheels

# Builds manylinux_2_28 x86_64 wheels (+ sdist) via cibuildwheel -- see pyproject.toml's
# [tool.cibuildwheel] for the actual build matrix/image/test-command. Separate from ci.yml
# deliberately: ci.yml's `pip install ".[test,hub]"` builds once, against whatever glibc the runner
# has, to test fast on every push; this workflow's job is the artifact that gets uploaded to PyPI,
# which is a slower, containerized, once-per-release thing.
#
# Publishing goes through PyPI trusted publishing, configured for all three projects (loom-py-rt and
# the two backends) -- there is no API token in this repo and none should be added. All three shipped
# 1.0.0rc3 through this path, which is what proves it rather than an assumption.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels/sdist to PyPI"
        type: boolean
        default: false
      gpu_smoke_test:
        description: "Also run the GPU smoke test (needs a self-hosted runner online)"
        type: boolean
        default: false

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    # NATIVE ARM RUNNERS, not QEMU. cibuildwheel can emulate aarch64 and it is the wrong tool here:
    # the base wheel compiles the whole engine, and the accelerator wheels below compile hundreds of
    # CUDA kernels, which under emulation is an overnight job rather than a slow one.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      # `submodules: recursive` is load-bearing here too -- same reason as ci.yml: the engine is a
      # submodule, and cibuildwheel copies this checkout as-is into its build containers.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A FULL VERSION, because `pypa/cibuildwheel@v2` does not resolve -- that repository publishes no
      # bare major tags at all, so the ref this workflow shipped with had never been valid. It went
      # unnoticed because this workflow had never run: its first execution, after the P4.8 merge,
      # failed both base-wheel jobs at "Unable to resolve action". The backend jobs below were
      # unaffected because they invoke `pipx run cibuildwheel` instead, which is also the evidence
      # that this project's [tool.cibuildwheel] config is v4-compatible.
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-base-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # The accelerator packages. One wheel per platform and NOT per interpreter: the payload is a plain
  # shared library that ggml dlopens and Python never imports, so these are tagged `py3-none-*` and
  # `build = "cp310-*"` in each pyproject names only the interpreter that runs the build.
  #
  # `packaging/stage.py` is required rather than convenient. cibuildwheel mounts ONLY the package
  # directory into its container, and a backend package deliberately reaches outside itself for the
  # shared BackendPackage.cmake and for the engine submodule's GgmlPin.cmake -- which is what stops a
  # backend wheel being built against a ggml its base wheel never saw. Staging assembles a complete
  # tree from the submodule instead of duplicating the pin (BACKLOG.md P4.8i).
  build-backends:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read     # pulling the manylinux-loom image built by build-image.yml
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan]
        # `arch` is a MATRIX KEY, not an include-only one, and the difference is not cosmetic. With
        # only `backend` in the matrix and two include objects carrying `arch`/`runner`, GitHub applies
        # the first to every combination and then finds the second one conflicts -- producing jobs with
        # no `backend` set rather than the four intended. Listing both axes and using `include` purely
        # to map an arch onto its runner is the spelling that means what it looks like.
        arch: [x86_64, aarch64]
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A CUDA image is several gigabytes against a hosted runner's ~14 GB of free disk.
      - name: Reclaim disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; df -h /

      # A PUBLIC REPOSITORY DOES NOT MEAN A PUBLIC PACKAGE. ghcr images default to private even when
      # the repo that built them is public, so an anonymous `docker pull` of the image below returns
      # `unauthorized` -- verified by trying it. cibuildwheel pulls its container itself and does not
      # authenticate, so without this step the job fails on its own image.
      #
      # Logging in here rather than making the package public keeps the workflow working under either
      # visibility, and `packages: read` is the whole of the permission it needs.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the package
        run: python packaging/stage.py ${{ matrix.backend }} staged

      # The image carries the SDK, so there is no before-all here -- see .github/docker/Dockerfile.
      # Run FROM the staged directory: cibuildwheel requires the package to be inside the working
      # directory, which is also why staging writes into the workspace rather than to a temp path.
      - name: Build
        working-directory: staged
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Arch-suffixed, matching build-image.yml's tags. cibuildwheel reads whichever of these two
          # matches the arch it is building, so setting both is correct rather than redundant.
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.backend }}-x86_64
          CIBW_MANYLINUX_AARCH64_IMAGE: ghcr.io/${{ github.repository_owner }}/manylinux-loom:${{ matrix.backend }}-aarch64
        run: pipx run cibuildwheel --output-dir ../wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.backend }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # THE ONE CHECK A HOSTED RUNNER CANNOT DO. Building CUDA needs no GPU, so everything above runs on
  # hosted runners; running a model needs one. This job is why the workstation is registered as a
  # self-hosted runner, and it is not ceremony -- a soname mismatch between the base wheel and a
  # backend loads without error, registers nothing, and shows up only as an accelerator missing from
  # `loom.devices()` (BACKLOG.md P4.8g). Nothing in the build catches that.
  # OPT-IN, AND NOT A RELEASE GATE -- deliberately, because the alternative is worse than no check.
  # A job targeting self-hosted labels with no matching runner online does not fail fast: it sits
  # queued for up to 24 hours and then times out, so putting this in `publish-pypi`'s `needs:` would
  # mean every release silently depends on one machine being switched on, and hangs rather than fails
  # when it is not.
  #
  # When a runner is registered and you want releases actually gated on a model running: add
  # `gpu-smoke-test` back to publish-pypi's `needs:` and drop the `if:` below. That is a deliberate
  # trade -- it buys the one check a hosted runner cannot do, at the cost of tying releases to a
  # machine's uptime.
  gpu-smoke-test:
    needs: [build-wheels, build-backends]
    if: ${{ inputs.gpu_smoke_test }}
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*-x86_64
          path: dist
          merge-multiple: true

      - name: Install into a clean venv and run a model
        env:
          # A real exported GGUF on the runner. The gate suite's own fixture rule, not a path baked in
          # here -- see the engine's tests/support/fixtures.h.
          LOOM_FIXTURES: ${{ env.LOOM_FIXTURES }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/loom-smoke
          /tmp/loom-smoke/bin/pip install --quiet dist/*.whl
          cd /tmp   # a neutral cwd, so the venv's package is what gets imported
          /tmp/loom-smoke/bin/python - <<'EOF'
          import loom
          names = [d["name"] for d in loom.devices()]
          print("devices:", names)
          assert any(n != "CPU" for n in names), (
              "no accelerator registered -- a backend that fails to load does so SILENTLY, "
              "so this assertion is the only thing standing between that and a green release"
          )
          EOF

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `sdist.include` in pyproject.toml's [tool.scikit-build] is what makes vendor/loom.cpp/** land
      # in the tarball -- without it, `pip install` from the sdist alone fails the same way a bare
      # checkout without `--recursive` does.
      - run: pip install build && python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # PUBLISHES ON RELEASE, one project at a time. This is three uploads rather than one because the
  # artifacts belong to THREE PyPI projects -- loom-py-rt, -cuda and -vulkan -- and trusted publishing
  # mints its token by exchanging an OIDC claim per project. One upload of a mixed directory may work,
  # depending on how the exchange scopes the token across projects that share a publisher; three
  # unambiguously do, and a failure names which project it was rather than leaving you to guess.
  #
  # Each project has a TRUSTED PUBLISHER on PyPI (owner `loom-ai-org`, repo `loom-py`, workflow
  # `wheels.yml`, environment `pypi`), which is what mints the token -- there is none stored here and
  # none should be added. A fourth project would need its own publisher added before its first upload;
  # everything above this job runs regardless, and its artifacts are downloadable from the run.
  #
  # `skip-existing` because PyPI filenames are IMMUTABLE and re-running a partly-failed release is the
  # normal recovery: without it the second attempt dies on the files the first one already uploaded.
  # It does not paper over a real problem -- a file that differs from what is published cannot be
  # uploaded under either setting.
  #
  # ORDER: the backends last. A base wheel with no backend published leaves `[cuda]` unresolvable,
  # which is a visible install error; a backend with no base is the same error from the other side.
  # Neither is silent, so this is about which half is fixed sooner rather than about safety.
  publish-pypi:
    needs: [build-wheels, build-backends, build-sdist]
    if: ${{ github.event_name == 'release' || inputs.publish }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC) -- no token stored in this repo
    steps:
      # Each project's files into their own directory. The artifact NAMES already carry the split --
      # `wheels-base-*`, `wheels-cuda-*`, `wheels-vulkan-*` -- which is why they are named that way.
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-base-*"
          path: dist-base
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist-base
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-cuda-*"
          path: dist-cuda
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-vulkan-*"
          path: dist-vulkan
          merge-multiple: true

      - name: Publish loom-py-rt
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-base
          skip-existing: true

      - name: Publish loom-py-rt-cuda
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cuda
          skip-existing: true

      - name: Publish loom-py-rt-vulkan
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-vulkan
          skip-existing: true
