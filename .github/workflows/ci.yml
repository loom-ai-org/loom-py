name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # BOTH PLATFORMS ON EVERY PUSH, and the macOS row earns its minutes rather than decorating the
    # matrix. P4.10 fixed three things that are invisible on Linux for structural reasons -- a
    # sub-make inheriting a jobserver, exception typeinfo not coalescing under Mach-O's two-level
    # namespace, and `/tmp` being a symlink -- and every one of them would otherwise have come back
    # at RELEASE time, in `wheels.yml`, which runs on a tag. This is where a macOS regression should
    # be found. (Retro-024 in the engine's docs/retros.)
    #
    # Apple Silicon only: `macos-15-intel` is built by the release workflow, and Apple Intel is a
    # deliberately CI-only, best-effort row -- doubling this job for it would double the cost of
    # every push to cover the platform that is ending.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    steps:
      # `submodules: recursive` is load-bearing: the engine IS a submodule, and without it the build
      # fails at `add_subdirectory(vendor/loom.cpp)` with a directory that exists and is empty.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ccache
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache

      # Homebrew rather than apt, and `|| true` because the macOS images may already carry it --
      # `brew install` on an installed formula is a non-zero exit, not a no-op.
      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'vendor/loom.cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'vendor/loom.cpp/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: Build and install
        run: pip install -v ".[test,hub]"

      # `cd` out of the source tree first, so the import under test is the INSTALLED package rather
      # than the source directory that happens to be named `loom` -- which would pass without the
      # extension having been built at all.
      - name: Import the installed package
        run: cd /tmp && python -c "import loom; print(loom.__version__)"

      # tests/ci only. tests/gate needs a real exported GGUF, which is produced by loom-exporter from
      # a checkpoint this runner does not have; it skips cleanly, and is run where the models are.
      - name: Test
        run: pytest tests/ci -q
