[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "loom-py-rt-cuda"
# Deliberately the same version as the base package, and see `dependencies` for why it is not merely
# a convention.
version = "1.0.0-rc5"
description = "CUDA backend for loom-py-rt"
# Two entries, not one table with both keys, and that is the difference between `pip show` printing
# an author and printing a blank line. PEP 621 maps {name, email} TOGETHER onto a single
# `Author-email: Name <email>` header and leaves `Author:` empty; a name-only entry is what populates
# `Author:`. Split, both fields are filled, which is what a reader of `pip show` expects.
authors = [
    { name = "Flávio De Melo" },
    { email = "flavio.eler@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# An EXACT pin, not a compatible-release range (BACKLOG.md P4.8). This wheel carries a
# libggml-cuda.so that gets dlopened beside the base wheel's libggml-base.so, and ggml makes no ABI
# promise across revisions -- so any loom-py-rt release that bumps its ggml pin invalidates every
# backend wheel published before it. `~=` would let pip pair two libraries that do not agree and the
# failure would surface as a symbol error at model load, or worse, not at all.
#
# This is not hypothetical for this package: it was built against ggml v0.19.0 only because the pin
# moved off v0.16.0 first (P4.9), and a wheel built an hour earlier would already be wrong.
dependencies = [
    "loom-py-rt == 1.0.0rc5",
    # The CUDA runtime, from NVIDIA's own wheels rather than bundled here. `libcublas.so.12` alone
    # would dwarf this package, and a machine with an NVIDIA GPU is not surprised to be asked for
    # NVIDIA's runtime. They unpack to `nvidia/cublas/lib` and `nvidia/cuda_runtime/lib`, siblings of
    # this package in site-packages, which is what the RPATH in CMakeLists.txt points at.
    #
    # `cu12`, NOT `cu13`, and that decision drove the toolkit choice rather than following it: the
    # `nvidia-*-cu13` names exist on PyPI only as 1.4 KB placeholder sdists at version 0.0.1, so a
    # CUDA 13 build has no distributable runtime. The `cu12` line reaches 12.9, and 12.9 is exactly
    # the minimum for `121a-real` -- so building against 12.9 gets DGX Spark coverage AND a runtime
    # that pip can actually install, where 13.x gets only the first.
    #
    # Lower bound rather than a pin: these are ABI-stable within the CUDA 12 major version, and
    # pinning would fight every other package in an environment that also wants them (torch above all).
    "nvidia-cuda-runtime-cu12 >= 12.9",
    "nvidia-cublas-cu12 >= 12.9",
]

[tool.scikit-build]
wheel.packages = ["loom_rt_cuda"]
# `py3-none-manylinux_...` rather than `cp39-cp39-manylinux_...`. The payload is a plain shared
# library with no CPython ABI in it -- it is dlopened by ggml, never imported by Python -- so the
# interpreter dimension the default tag would encode is not real, and encoding it would mean five
# identical wheels per architecture.
wheel.py-api = "py3"
cmake.version = ">=3.24"
cmake.build-type = "Release"
# No sdist. This build reads the engine submodule above the package root for its ggml pin, which an
# sdist would not carry -- and a backend sdist that built standalone would be one that could build
# against the wrong ggml. See packaging/common/BackendPackage.cmake.
sdist.exclude = ["*"]

[tool.cibuildwheel]
# The .so contains no Python at all -- no CPython ABI, no extension module -- so one build serves
# every interpreter.
build = "cp310-*"
skip = "pp* *-musllinux_* *_i686"
manylinux-x86_64-image = "manylinux_2_28"
# x86-64 and aarch64: the second is Jetson/Grace, which is a real CUDA target rather than a
# theoretical one. Metal would be arm64 macOS alone; Vulkan is the same two as this.
archs = "x86_64 aarch64"
# The CUDA toolkit is not in the manylinux image, so CI has to put it there before cmake runs. Left
# as a comment rather than a command because the right one depends on the runner, and a wrong one
# fails deep inside a container build. It must be **12.9 or newer**: 12.9 is the minimum for
# `121a-real` (DGX Spark) and the newest the `nvidia-*-cu12` runtime wheels exist for, so it is the
# only version that gets both coverage and a runtime pip can install.
#   before-all = "..."   # install cuda-toolkit >= 12.9 via the image's package manager
#
# THE REPAIR STEP HAS TO EXCLUDE WHAT WE DELIBERATELY DID NOT BUNDLE. cibuildwheel runs `auditwheel
# repair` by default, and auditwheel's whole job is to copy external shared libraries INTO the wheel
# and rewrite RPATHs to point at its own `.libs` directory. Left alone it would pull `libcublas.so.12`
# in -- undoing the `nvidia-*` dependency, and adding hundreds of megabytes to a 72 MB wheel.
#
# `libggml-base.so` is excluded for a different reason: it is genuinely absent at repair time, being
# the BASE wheel's to ship, and auditwheel treats a library it cannot locate as an error rather than
# as somebody else's problem.
# `libcuda.so.1` is the DRIVER, and excluding it is a correctness point rather than a size one:
# it is not redistributable and belongs to whatever driver the user has installed. The build
# container links against a stub (`cuda-driver-devel`), so auditwheel finds a reference it cannot
# resolve and stops -- "Cannot repair wheel, because required library libcuda.so.1 could not be
# located" -- which is auditwheel doing its job, not a broken build.
repair-wheel-command = "auditwheel repair --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libcublas.so.12 --exclude libcublasLt.so.12 --exclude libnvrtc.so.12 --exclude libggml-base.so -w {dest_dir} {wheel}"


[project.urls]
Homepage = "https://github.com/loom-ai-org/loom-py"
Engine = "https://github.com/loom-ai-org/loom.cpp"
