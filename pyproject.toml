[build-system]
# Deliberately NOT listing cmake/ninja here -- scikit-build-core manages both itself (downloading a
# compliant version when the container's own is missing or too old) and warns against listing them
# explicitly, which just risks fighting its own resolution. Tried the explicit-pin version of this
# comment first; the build itself printed the warning that corrected it.
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "loom-py-rt"
version = "1.0.0-rc6"
description = "Python bindings for loom.cpp, a data-driven ggml inference engine"
# Two entries, not one table with both keys, and that is the difference between `pip show` printing
# an author and printing a blank line. PEP 621 maps {name, email} TOGETHER onto a single
# `Author-email: Name <email>` header and leaves `Author:` empty; a name-only entry is what populates
# `Author:`. Split, both fields are filled, which is what a reader of `pip show` expects.
authors = [
    { name = "Flávio De Melo" },
    { email = "flavio.eler@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No runtime dependencies, deliberately. Loading a GGUF and running its driver is the engine's job,
# and the arrays crossing the boundary are plain sequences of floats -- so numpy is something a caller
# may use rather than something this package makes them install.
dependencies = []

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]

# TEXT-TO-SPEECH FROM TEXT (loom.cpp BACKLOG.md Task #79). A phoneme-input TTS model carries the symbol
# table that turns phonemes into its own ids, but not grapheme-to-phoneme conversion -- that is a
# property of the language rather than of any checkpoint, so it lives here. Optional because this
# package declares no runtime dependencies on purpose and orthography2ipa brings numpy, langcodes and
# ovos-spec-tools with it: a caller running an LM or an ASR model should not pay for a G2P engine.
# Apache-2.0, so nothing about it constrains this package's own licensing.
phonemes = ["orthography2ipa>=7.30"]

# ACCELERATORS (BACKLOG.md P4.8). `pip install "loom-py-rt[vulkan]"` fetches one small wheel holding
# one libggml-vulkan.so; this package finds it on sys.path at import and `device="auto"` uses it. The
# base wheel is unchanged either way -- that is the point of GGML_BACKEND_DL, and it is why there is
# no `cu121`-style second copy of everything.
#
# Note these are UNLIKE `[hub]`, which is a pure-Python feature toggle that always resolves. An
# accelerator extra is a hardware claim, it is architecture-specific, and it may not exist for the
# platform at all -- `pip install "loom-py-rt[metal]"` on Linux will FAIL to resolve, and that is the
# intended behaviour rather than an oversight. The alternative (an environment marker, so `[metal]`
# quietly resolves to nothing off macOS) hands back a successful install and no Metal, and the user
# finds out from an unexplained performance number much later. It is the same call `Device::open("gpu")`
# already makes in raising rather than silently running on the CPU: someone who spelled out the
# accelerator is asserting something about the machine, and should be told when it is not true.
#
# There is deliberately NO `[all]` extra. That is the per-accelerator wheel matrix wearing a hat -- it
# cannot resolve on any single platform, since these are mutually exclusive by architecture.
# `[vulkan,cuda]` together is legitimate: with GGML_BACKEND_DL the registry picks at run time.
vulkan = ["loom-py-rt-vulkan == 1.0.0rc6"]
cuda = ["loom-py-rt-cuda == 1.0.0rc6"]
# Apple Silicon macOS ONLY -- there is no arm64-Linux or Intel-Mac Metal wheel to resolve to, so this
# is the extra the paragraph above is describing when it says one may not exist for the platform at
# all. On anything but an Apple Silicon Mac this FAILS, by design.
metal = ["loom-py-rt-metal == 1.0.0rc6"]
# `gguf` writes the handful of tiny synthetic GGUFs tests/ci builds to check what the binding does with
# a file it has never seen -- an unrecognized `tokenizer.ggml.model` tag, most importantly. Those cases
# are unreachable with a fake handle (they are decisions the C++ makes at load time), and mocking them
# would test the mock. It stays a TEST dependency: nothing in the shipped package reads or writes GGUF
# from Python.
test = ["pytest>=7", "gguf>=0.10", "numpy"]

[project.urls]
Homepage = "https://github.com/loom-ai-org/loom-py"
Engine = "https://github.com/loom-ai-org/loom.cpp"
Exporter = "https://github.com/loom-ai-org/loom-exporter"

[tool.scikit-build]
# The engine is a submodule; a source distribution has to carry it or the wheel cannot be built from
# one. `sdist.include` is what puts it there.
sdist.include = ["vendor/loom.cpp/**"]
wheel.packages = ["loom"]
cmake.version = ">=3.24"  # CMakeLists.txt's $<LINK_LIBRARY:WHOLE_ARCHIVE,...> needs it
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests/ci"]
markers = [
    "gate: needs a real exported GGUF on disk; not run by CI (see tests/gate/)",
]

[tool.cibuildwheel]
# CPython only, matching requires-python -- no PyPy (an untested build target for a pybind11 extension
# this small a user base doesn't need yet) and no 32-bit (irrelevant for the models this ships).
build = "cp310-* cp311-* cp312-* cp313-*"
# musllinux skipped for now: LuaJIT's Makefile build (cmake/Dependencies.cmake in the vendored engine)
# is untested against musl's libc, and nothing here has verified it works. Lift this once someone has.
skip = "pp* *-musllinux_* *_i686"
build-frontend = "build"
# manylinux2014's CentOS 7 base is EOL (June 2024); manylinux_2_28's glibc 2.28 floor already covers
# everything but already-EOL distros. cibuildwheel builds INSIDE this image (not on the runner's own
# glibc, which is newer and would make auditwheel bump the tag past _28 -- confirmed by hand: a plain
# build on this dev box's own glibc came out needing manylinux_2_34), then runs `auditwheel repair`
# against what actually got linked, so the wheel it produces is genuinely manylinux_2_28-compatible.
manylinux-x86_64-image = "manylinux_2_28"
# THE SAME FLOOR ON aarch64, stated rather than inherited. cibuildwheel's own default happens to be
# manylinux_2_28 here too -- the published rc3 aarch64 wheels came out tagged
# `manylinux_2_27_aarch64.manylinux_2_28_aarch64` without this line -- but "which glibc does a
# Raspberry Pi need" should not be answered by a default that a cibuildwheel bump may move. 2.28 is
# below every 64-bit Raspberry Pi OS in service: Bullseye is 2.31 and Bookworm is 2.36.
manylinux-aarch64-image = "manylinux_2_28"
# macOS IS WIRED UP AS OF P4.10, in both workflows: `wheels.yml`'s build matrix has a `macos-15`
# (arm64) and a `macos-15-intel` (x86_64) row, and `ci.yml` builds and runs `pytest tests/ci` on
# `macos-15` on every push -- which is where a macOS regression should be caught, rather than at a
# release. The arm64 wheel has also been built, installed and run on a real M1 Pro, which is a
# stronger statement than either. Windows is still out of scope and stays behind this.

# The `[test]` extra, rather than a second copy of its contents. This was `test-requires =
# ["pytest>=7"]`, which was that copy -- and it drifted: `tests/ci/test_vocab_dispatch.py` writes a
# real GGUF with `gguf.GGUFWriter` and a numpy tensor, so the wheel test step began failing at
# COLLECTION, which aborts every remaining interpreter rather than failing one test. Naming the extra
# means a test dependency added for `pytest tests/ci` is automatically there for the wheels too, and
# the two cannot disagree again.
#
# None of this reaches the shipped package: `dependencies` is still empty and stays that way.
test-extras = ["test"]
# Run from cibuildwheel's own temp cwd (not {project}) so the test imports the INSTALLED wheel rather
# than the source tree's `loom/` package shadowing it on sys.path -- the same trap ci.yml's "Import the
# installed package" step guards against, just automatic here since cibuildwheel doesn't cwd into
# {project} for the test step.
test-command = "python -c \"import loom; print(loom.__version__)\" && pytest {project}/tests/ci -q"

[tool.cibuildwheel.macos]
# THE DEPLOYMENT FLOOR, DECLARED RATHER THAN INHERITED, and it has to be set HERE rather than only in
# CMake because the two halves of the promise are made in different places. CMakeLists.txt sets
# `CMAKE_OSX_DEPLOYMENT_TARGET`, which decides what the Mach-O binaries actually require
# (`LC_BUILD_VERSION minos`); scikit-build-core decides the wheel's FILENAME tag, and it reads this
# environment variable -- it does not read CMake. Leave it unset and the two disagree: a hand build
# produced binaries good for 11.0 inside a wheel named `macosx_15_0_arm64`, which pip then refuses to
# install on the macOS 12 it would have run on perfectly.
#
# 13.3 AND NOT cibuildwheel's 11.0/10.13 DEFAULTS, and the reason is Accelerate. ggml's BLAS backend
# is compiled with `ACCELERATE_NEW_LAPACK` and `ACCELERATE_LAPACK_ILP64`
# (`src/ggml-blas/CMakeLists.txt`, unconditional for Apple, with no deployment-target gating), which
# selects Accelerate's NEW BLAS interface -- `cblas_sgemm$NEWLAPACK$ILP64`, a symbol that exists only
# on **macOS 13.3+**. At an 11.0 floor the first macOS CI run said so out loud:
#
#     ggml-blas.cpp:142:13: warning: 'cblas_sgemm' is only available on macOS 13.3 or newer
#
# and the resulting wheel would install happily on macOS 11 or 12 and then quietly not have a BLAS
# backend -- `dlopen` fails on the missing symbol and ggml skips it, which is the SILENT failure mode
# P4.8a already cost a build cycle to find. BLAS is not optional-in-practice either: it is **1.80x on
# whisper-small** (990 ms against the CPU's 1778 ms) on an M1 Pro, and neutral on VITS.
#
# So the choice was between a tag that overpromises, a ggml patch, and a floor that tells the truth.
# This is the floor telling the truth. It costs macOS 11-13.2, which in 2026 is a small and shrinking
# slice of Apple Silicon -- and the alternative was a platform that looks supported and silently
# isn't, which is the pattern this project rejects everywhere else (`[metal]` failing to resolve off
# macOS, `device="gpu"` raising rather than falling back).
#
# ONE NUMBER FOR BOTH ARCHITECTURES, so there is no `overrides` block any more: Accelerate's new BLAS
# lands on 13.3 for Intel too, and every Intel Mac that reached macOS 13 can reach 14.#
# AND THE NUMBER IS 14.0, NOT THE 13.3 THE REQUIREMENT ACTUALLY IS, because 13.3 is not expressible
# as a wheel tag. Since macOS 11 the platform tag carries only the MAJOR version -- `packaging`
# generates `macosx_15_0`, `macosx_14_0`, `macosx_13_0`, ... and nothing with a non-zero minor, so
# `macosx_13_3_arm64` matches nothing pip offers. scikit-build-core knows this and zeroes the minor,
# which means `MACOSX_DEPLOYMENT_TARGET=13.3` would ship binaries needing 13.3 inside a wheel tagged
# `macosx_13_0` -- installable on 13.0, 13.1 and 13.2, and silently BLAS-less there. That is the
# same defect one major version smaller. 14.0 is the lowest floor that is both expressible and true.
# Verified rather than reasoned: `normalize_macos_version("13.3", arm=True)` returns `13.0`.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
